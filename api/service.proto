syntax = "proto3";

package ecommerce.inventory.v1;

import "google/protobuf/timestamp.proto";

service InventoryService {
  rpc CheckAvailability(CheckAvailabilityRequest)
      returns (CheckAvailabilityResponse);

  rpc ReserveItems(ReserveItemsRequest)
      returns (ReserveItemsResponse);

  rpc StreamReservationUpdates(StreamReservationUpdatesRequest)
      returns (stream ReservationUpdate);
}

enum ReservationStatus {
  RESERVATION_STATUS_UNSPECIFIED = 0;
  RESERVATION_STATUS_PENDING = 1;
  RESERVATION_STATUS_RESERVED = 2;
  RESERVATION_STATUS_REJECTED = 3;
  RESERVATION_STATUS_RELEASED = 4;
}

message InventoryItem {
  string product_id = 1;
  int64 quantity = 2;
  double unit_weight_kg = 3;
}

message CheckAvailabilityRequest {
  repeated InventoryItem items = 1;
}

message CheckAvailabilityResponse {
  message ItemResult {
    string product_id = 1;
    int64 requested_quantity = 2;
    int64 available_quantity = 3;
    bool available = 4;
  }

  repeated ItemResult items = 1;
  bool all_items_available = 2;
  google.protobuf.Timestamp checked_at = 3;
}

message ReserveItemsRequest {
  string order_id = 1;
  repeated InventoryItem items = 2;
}

message ReserveItemsResponse {
  message ReservationInfo {
    string reservation_id = 1;
    ReservationStatus status = 2;
    google.protobuf.Timestamp expires_at = 3;
  }

  bool success = 1;
  ReservationInfo reservation = 2;
  string message = 3;
}

message StreamReservationUpdatesRequest {
  string reservation_id = 1;
}

message ReservationUpdate {
  string reservation_id = 1;
  ReservationStatus status = 2;
  google.protobuf.Timestamp updated_at = 3;
  string description = 4;
}

message BenchmarkOrder {
  string order_id = 1;
  string customer_id = 2;

  message OrderItem {
    string product_id = 1;
    string product_name = 2;
    int64 quantity = 3;
    double unit_price = 4;
  }

  message Address {
    string city = 1;
    string street = 2;
    string building = 3;
    string postal_code = 4;
    string country = 5;
  }

  repeated OrderItem items = 3;
  Address shipping_address = 4;
  double total_amount = 5;
  map<string, string> metadata = 6;
  google.protobuf.Timestamp created_at = 7;
}